# Reusable workflow: handle one ticket event for a managed repo.
# Called by templates/managed-repo/.github/workflows/frontera.yml. See docs/GITHUB.md.
name: frontera-agent

on:
  workflow_call:
    inputs:
      frontera_ref:
        description: Git ref of violetroom/frontera to install
        type: string
        default: main
      config:
        type: string
        default: .github/frontera.yaml
      opencode_version:
        description: OpenCode v2 build (opencode.ai/files/bin, the anomalyco/tap opencode-v2 channel)
        type: string
        default: "2.0.26"
      opencode_sha256:
        description: SHA-256 of opencode-linux-x64-baseline.tar.gz for that version
        type: string
        default: "0e682946fea509299f1515dfb6261aa5cf8d1d2e5ccdc833470523acb7222106"
      claude_version:
        type: string
        default: "2.1.299"
      tellico_setup_ref:
        description: >-
          Commit of Yejashi/tellico-agentic-setup whose OpenCode plugins and settings (loop-guard,
          compaction-guard, secret-guard, disk-guard, tool_output, compaction) Qwen runs use.
          Pinned to a reviewed commit; bump deliberately.
        type: string
        default: "bf48214871fc3c1c0963dc41ca88bdeb1dc28433"
      remote_control:
        description: >-
          Publish Qwen/OpenCode sessions to the Tellico relay (<gateway host>/tellico/) so the owner can
          watch and steer them live. Signs in with TELLICO_API_KEY. Claude Code runs are not covered.
        type: boolean
        default: false
    secrets:
      TELLICO_GATEWAY_URL:
        required: false
      TELLICO_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      FRONTERA_PRIVATE_TERMS:
        required: false
      FRONTERA_APP_ID:
        required: false
      FRONTERA_APP_PRIVATE_KEY:
        required: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HAS_FRONTERA_APP: ${{ secrets.FRONTERA_APP_ID != '' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install frontera
        env:
          FRONTERA_REF: ${{ inputs.frontera_ref }}
        run: python -m pip install -q "git+https://github.com/violetroom/frontera@${FRONTERA_REF}"

      - name: Install agent CLIs
        env:
          OPENCODE_VERSION: ${{ inputs.opencode_version }}
          OPENCODE_SHA256: ${{ inputs.opencode_sha256 }}
          CLAUDE_VERSION: ${{ inputs.claude_version }}
        run: |
          mkdir -p "$HOME/.opencode/bin"
          curl -fsSL -o /tmp/opencode.tgz "https://opencode.ai/files/bin/${OPENCODE_VERSION}/opencode-linux-x64-baseline.tar.gz"
          echo "${OPENCODE_SHA256}  /tmp/opencode.tgz" | sha256sum -c -
          tar -xzf /tmp/opencode.tgz -C "$HOME/.opencode/bin" opencode
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version
          "$HOME/.local/bin/claude" --version

      - name: Fetch the Tellico OpenCode setup
        # Outside the workspace, so it never shows up as a change in the managed repo.
        env:
          TELLICO_SETUP_REF: ${{ inputs.tellico_setup_ref }}
        run: |
          d="$RUNNER_TEMP/tellico-agentic-setup"
          git init -q "$d"
          git -C "$d" fetch -q --depth 1 https://github.com/Yejashi/tellico-agentic-setup "$TELLICO_SETUP_REF"
          git -C "$d" checkout -q FETCH_HEAD
          test "$(git -C "$d" rev-parse HEAD)" = "$TELLICO_SETUP_REF"
          echo "TELLICO_SETUP_DIR=$d" >> "$GITHUB_ENV"

      - name: Configure remote control
        if: inputs.remote_control
        # The key goes to a private file for the plugin; only its path and the relay URL go to the env.
        env:
          TELLICO_GATEWAY_URL: ${{ secrets.TELLICO_GATEWAY_URL }}
          TELLICO_API_KEY: ${{ secrets.TELLICO_API_KEY }}
          REPO: ${{ github.repository }}
        run: |
          key="$RUNNER_TEMP/tellico-relay-key"
          ( umask 077; printf '%s' "$TELLICO_API_KEY" > "$key" )
          url="${TELLICO_GATEWAY_URL%/}"
          {
            echo "TELLICO_REMOTE_CONTROL=1"
            echo "TELLICO_RELAY_URL=${url%/v1}/tellico"
            echo "TELLICO_RELAY_KEY_FILE=$key"
            echo "TELLICO_RELAY_MACHINE=actions ${REPO#*/}"
          } >> "$GITHUB_ENV"

      - name: Mint the Frontera App token
        # With the App, agent PRs trigger CI and merges behave like a normal account's.
        # Without its secrets this is skipped and the workflow token is used as before.
        id: app-token
        if: env.HAS_FRONTERA_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FRONTERA_APP_ID }}
          private-key: ${{ secrets.FRONTERA_APP_PRIVATE_KEY }}

      - name: Handle event
        env:
          CONFIG: ${{ inputs.config }}
          GH_TOKEN: ${{ github.token }}
          FRONTERA_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          TELLICO_GATEWAY_URL: ${{ secrets.TELLICO_GATEWAY_URL }}
          TELLICO_API_KEY: ${{ secrets.TELLICO_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FRONTERA_PRIVATE_TERMS: ${{ secrets.FRONTERA_PRIVATE_TERMS }}
        run: frontera --config "$CONFIG" action

      - name: Keep run records
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontera-runs-${{ github.run_id }}
          path: .frontera/runs/
          retention-days: 14
          if-no-files-found: ignore
